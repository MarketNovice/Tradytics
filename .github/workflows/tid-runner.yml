name: tid-runner

# Each scan has cron entries for both the EDT and EST offsets (cron is UTC). The runner's --window flag
# makes the entry that lands outside the scan's ET window exit without doing anything, and the
# duplicate guard makes a later entry skip once a run has completed. See tid-runner/README.md.
on:
  schedule:
    - cron: "20 11 * * 1-5"   # morning  (07:20 EDT)
    - cron: "20 12 * * 1-5"   # morning  (08:20 EDT / 07:20 EST)
    - cron: "20 13 * * 1-5"   # morning  (09:20 EDT / 08:20 EST)
    - cron: "5 16 * * 1-5"    # midday   (12:05 EDT)
    - cron: "5 17 * * 1-5"    # midday   (13:05 EDT / 12:05 EST)
    - cron: "5 18 * * 1-5"    # midday   (13:05 EST)
    - cron: "5 19 * * 1-5"    # afternoon (15:05 EDT)
    - cron: "35 19 * * 1-5"   # afternoon (15:35 EDT / 14:35 EST)
    - cron: "5 20 * * 1-5"    # afternoon (15:05 EST)
    - cron: "40 22 * * 1-5"   # oi       (18:40 EDT / 17:40 EST)
    - cron: "40 23 * * 1-5"   # oi       (19:40 EDT / 18:40 EST)
  workflow_dispatch:
    inputs:
      scan:
        description: Scan to run
        type: choice
        options: [morning, midday, afternoon, oi]
        default: midday
      dry_run:
        description: Dry run (no database writes)
        type: boolean
        default: true
      force:
        description: Force (ignore holiday and duplicate guards)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tid-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Pick scan
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCAN: ${{ inputs.scan }}
          INPUT_DRY: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            flags=""
            [ "$INPUT_DRY" = "true" ] && flags="$flags --dry-run"
            [ "$INPUT_FORCE" = "true" ] && flags="$flags --force"
            echo "args=--scan $INPUT_SCAN$flags" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "20 11 * * 1-5"|"20 12 * * 1-5"|"20 13 * * 1-5") scan=morning ;;
            "5 16 * * 1-5"|"5 17 * * 1-5"|"5 18 * * 1-5") scan=midday ;;
            "5 19 * * 1-5"|"35 19 * * 1-5"|"5 20 * * 1-5") scan=afternoon ;;
            "40 22 * * 1-5"|"40 23 * * 1-5") scan=oi ;;
            *) echo "unknown schedule '$SCHEDULE'"; exit 2 ;;
          esac
          echo "args=--scan $scan --window" >> "$GITHUB_OUTPUT"
      - name: Run
        env:
          TRADYTICS_API_KEY: ${{ secrets.TRADYTICS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADYTICS_RPM: ${{ vars.TRADYTICS_RPM || '8' }}
          OI_MAX_DTE: ${{ vars.OI_MAX_DTE || '60' }}
        run: deno run -A tid-runner/run.ts ${{ steps.pick.outputs.args }}
